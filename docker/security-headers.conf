# Included in every location that sets its own add_header (nginx drops inherited ones there).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
# shortcut: form-action allows any https gateway, tighten to the exact eSewa/Khalti/Fonepay/Stripe hosts once fixed.
# Passport-OCR worker, wasm and language data are self-hosted under /ocr.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' wss:; media-src 'self' blob:; form-action 'self' https:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
